services:
  - type: web
    name: protrebot-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protrebot-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: PROTREBOT_WEB_REQUIRE_AUTH
        value: "true"
      - key: PROTREBOT_WEB_ACCESS_TOKEN
        sync: false
      - key: PROTREBOT_CORS_ORIGINS
        sync: false
      - key: PROTREBOT_DATA_DIR
        value: /tmp/protrebot-data
      - key: PROTREBOT_EXECUTION_MODE
        value: TESTNET_FIRST
      - key: PROTREBOT_PAPER_ENABLED
        value: "false"
      - key: PROTREBOT_LIVE_CHANNEL_ENABLED
        value: "true"
      - key: PROTREBOT_DEPLOYMENT_TIER
        value: "FREE_PREVIEW"
      - key: BINANCE_DEMO_API_KEY
        sync: false
      - key: BINANCE_DEMO_SECRET_KEY
        sync: false
      - key: BINANCE_LIVE_API_KEY
        sync: false
      - key: BINANCE_LIVE_SECRET_KEY
        sync: false

databases:
  - name: protrebot-db
    plan: free
    region: frankfurt
    databaseName: protrebot
    user: protrebot
